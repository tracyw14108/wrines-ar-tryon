name: Sync Anpin AR Products

on:
  push:
    branches: [main]
    paths:
      - 'data/anpin-ar-products.json'
      - 'scripts/build_products.py'
      - '.github/workflows/sync-products.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests pillow rembg onnxruntime numpy opencv-python-headless

      - name: Build transparent product PNGs
        run: python scripts/build_products.py

      - name: Commit generated product assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/products
          if git diff --cached --quiet; then
            echo "No product asset changes."
          else
            git commit -m "Sync Anpin AR product assets"
            git push
          fi
