name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image dependency
        run: python -m pip install --upgrade pillow

      - name: Generate v7.2 transparent PNG angle assets
        run: python scripts/generate_angle_pngs.py

      - name: Validate v7.2 source and assets
        shell: bash
        run: |
          node --check src/main-v7.js
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image

          p = Path('public/products/products.json')
          items = json.loads(p.read_text())
          assert len(items) == 6, f'expected 6 products, got {len(items)}'
          required = {'front','left45','left90','right45','right90'}
          for item in items:
              sku = item.get('sku')
              assert item.get('render_mode') == 'angles', sku
              assets = item.get('angle_assets', {})
              assert required.issubset(assets), (sku, assets.keys())
              for key in required:
                  asset = Path('public/products') / assets[key]
                  assert asset.exists(), (sku, key, str(asset))
                  im = Image.open(asset)
                  assert im.mode == 'RGBA', (sku, key, im.mode)
                  assert im.getchannel('A').getextrema()[0] == 0, (sku, key, 'not transparent')
          print('Validated 6 SKUs x 5 transparent PNG angles')
          PY

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Verify dist output
        shell: bash
        run: |
          test -f dist/index.html
          test -f dist/products/products.json
          python - <<'PY'
          from pathlib import Path
          skus = ['YC4413E_1','YC3536E_1','YC5295E_1','YC9561E','YC8320E_1','EH-4520']
          angles = ['front','left45','left90','right45','right90']
          for sku in skus:
              for angle in angles:
                  p = Path('dist/products/angles') / f'{sku}_{angle}.png'
                  assert p.exists(), p
          print('Verified dist: 30 angle PNGs present')
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
