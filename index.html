<!doctype html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>W.RINES AR Try-On</title></head><body><main id="app"><section class="camera-shell"><video id="camera" autoplay playsinline muted></video><canvas id="overlay"></canvas><header class="topbar"><div><div class="brand">W.RINES</div><div class="sub">AR TRY-ON · EAR v1</div></div><span id="status" class="status">尚未啟動</span></header><div id="guide" class="guide"><div class="face-ring"></div><p>將臉放在畫面中央</p></div><div class="controls"><button id="startBtn" class="primary">開啟相機</button><div class="segmented"><button data-side="left">左耳</button><button data-side="both" class="active">雙耳</button><button data-side="right">右耳</button></div><label><span>耳環大小</span><input id="scaleRange" type="range" min="0.55" max="1.65" value="1" step="0.01"></label><label><span>垂直位置</span><input id="offsetYRange" type="range" min="-0.12" max="0.18" value="0.02" step="0.005"></label></div></section></main><script type="module" src="/src/main.js"></script></body></html>
