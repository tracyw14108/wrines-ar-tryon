<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0c0b0a" />
  <title>W.RINES AR Try-On</title>
</head>
<body>
  <main id="app">
    <section class="camera-shell">
      <video id="camera" autoplay playsinline muted></video>
      <canvas id="glCanvas"></canvas>

      <header class="topbar">
        <div>
          <div class="brand">W.RINES</div>
          <div class="sub">AR TRY-ON · EAR v6.1</div>
          <div id="productName" class="product-name">載入商品中</div>
          <div id="sizeStatus" class="size-status"></div>
        </div>
        <span id="status" class="status">尚未啟動</span>
      </header>

      <div id="guide" class="guide">
        <div class="face-ring"></div>
        <p>將臉放在畫面中央</p>
      </div>

      <div class="controls">
        <div class="action-row">
          <button id="startBtn" class="primary">開啟相機</button>
          <button id="captureBtn" class="secondary" disabled>截圖</button>
        </div>

        <div id="productStrip" class="product-strip" aria-label="耳環選擇"></div>

        <div class="segmented" role="group" aria-label="試戴位置">
          <button data-side="left">左耳</button>
          <button data-side="both" class="active">雙耳</button>
          <button data-side="right">右耳</button>
        </div>

        <label>
          <span>耳環大小</span>
          <input id="scaleRange" type="range" min="0.75" max="1.35" value="1" step="0.01" />
        </label>

        <label>
          <span>垂直位置</span>
          <input id="offsetYRange" type="range" min="-0.12" max="0.12" value="0" step="0.0025" />
        </label>
      </div>

      <div id="toast" class="toast" hidden></div>
    </section>
  </main>
  <script type="module" src="/src/main-v6-1.js"></script>
</body>
</html>
